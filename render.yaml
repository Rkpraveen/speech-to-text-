services:
  - type: web
    name: speech-to-text-backend
    env: python
    rootDir: backend
    region: oregon
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: GROQ_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true

  - type: web
    name: speech-to-text-frontend
    env: static
    rootDir: frontend
    region: oregon
    buildCommand: "npm install && npm run build"
    staticPublishPath: "./dist"
    envVars:
      - key: VITE_API_URL
        value: "https://speech-to-text-mdof.onrender.com"
      - key: VITE_WS_URL
        value: "wss://speech-to-text-mdof.onrender.com"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
